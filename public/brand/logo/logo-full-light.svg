<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <style>
      .brand-text {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -1.5px;
      }
    </style>
  </defs>

  <!-- ValueX Icon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Branch of V & solid base of X (Slate 900) -->
    <path
      d="M15 15 L32 68 L42 68 L58 42"
      stroke="#0F172A"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Growth branch of X (Bullish Green Arrow) -->
    <path
      d="M28 68 L68 15 M68 15 H50 M68 15 V33"
      stroke="#10B981"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Logotype ValueX -->
  <text x="105" y="66" class="brand-text" fill="#0F172A">
    Value<tspan fill="#10B981">X</tspan>
  </text>
</svg>
