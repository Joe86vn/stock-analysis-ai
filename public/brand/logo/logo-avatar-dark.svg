<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Premium Gradient Background -->
    <radialGradient id="avatarBgDark" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <linearGradient id="bullishGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#avatarBgDark)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- ValueX Centered Icon Symbol -->
  <g transform="translate(106, 106)" filter="url(#subtleGlow)">
    <!-- Branch of V & solid base of X (Pure White) -->
    <path
      d="M60 60 L120 240 L150 240 L195 150"
      stroke="#F8FAFC"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Growth branch of X (Bullish Green Arrow) -->
    <path
      d="M105 240 L225 60 M225 60 H165 M225 60 V120"
      stroke="url(#bullishGlow)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
